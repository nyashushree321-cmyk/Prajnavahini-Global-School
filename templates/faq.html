{% extends "base.html" %}
{% load static %}
{% block title %}FAQ - Prajnavahini Global School{% endblock %}
{% block content %}
              <!-- frequently-area -->
            <section class="faq-area pt-120 pb-120 p-relative fix">
                <div class="animations-10"><img src="{% static 'img/bg/an-img-04.png' %}" alt="an-img-01"></div>
                <div class="animations-08"><img src="{% static 'img/bg/an-img-05.png' %}" alt="contact-bg-an-01"></div>
                <div class="container">
                    <div class="row justify-content-center  align-items-center">

                        <div class="col-lg-7">
                            <div class="section-title wow fadeInLeft animated" data-animation="fadeInDown animated" data-delay=".2s">
                                <h2>Get every single answer here.</h2>

                            </div>
                               <div class="faq-wrap mt-30 pr-30 wow fadeInUp animated" data-animation="fadeInUp" data-delay=".4s">
                                <div class="accordion" id="accordionExample">
                                  {% for item in faq_items %}
                                    <div class="card">
                                        <div class="card-header">
                                            <h2 class="mb-0">
                                                <button class="faq-btn{% if not forloop.first %} collapsed{% endif %}" type="button" data-bs-toggle="collapse"
                                                    data-bs-target="#collapse{{ forloop.counter }}"  >
                                                   {{ forloop.counter|stringformat:"02d" }} {{ item.question }}
                                                </button>
                                            </h2>
                                        </div>
                                        <div id="collapse{{ forloop.counter }}" class="collapse{% if forloop.first %} show{% endif %}"
                                            data-bs-parent="#accordionExample">
                                            <div class="card-body">
{{ item.answer }}
                                            </div>
                                        </div>
                                    </div>
                                  {% endfor %}
                                </div>
                            </div>
                        </div>
					    <div class="col-lg-5">
                            <div class="contact-bg02">
                            <div class="section-title wow fadeInDown animated" data-animation="fadeInDown" data-delay=".4s">
                                <h2>
                                  Make An Contact
                                </h2>

                            </div>

							<form action="{% url 'base:contact_submit' %}" method="post" class="contact-form mt-30 wow fadeInUp animated" data-animation="fadeInUp" data-delay=".4s">
								{% csrf_token %}
								<input type="hidden" name="source_page" value="faq">
								<div class="row">
                            <div class="col-lg-12">
                                <div class="contact-field p-relative c-name mb-20">
                                    <input type="text" id="firstn" name="name" placeholder="First Name" required>
                                </div>
                            </div>

								<div class="col-lg-12">
                                <div class="contact-field p-relative c-subject mb-20">
                                    <input type="email" id="email" name="email" placeholder="Email" required>
                                </div>
                            </div>
                            <div class="col-lg-12">
                                <div class="contact-field p-relative c-subject mb-20">
                                    <input type="text" id="phone" name="phone" placeholder="Phone No." required>
                                </div>
                            </div>

                            <div class="col-lg-12">
                                <div class="contact-field p-relative c-message mb-30">
                                    <textarea name="message" id="message" cols="30" rows="10" placeholder="Write comments"></textarea>
                                </div>
                                <div class="slider-btn">
                                            <button class="btn ss-btn" type="submit" data-animation="fadeInRight" data-delay=".8s"><span>Submit Now</span> <i class="fal fa-long-arrow-right"></i></button>
                                        </div>
                            </div>
                            </div>

                    </form>

                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <!-- frequently-area-end -->
{% endblock %}
