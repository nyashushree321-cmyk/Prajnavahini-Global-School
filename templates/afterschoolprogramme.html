{% extends "base.html" %}
{% load static %}
{% block title %}After School Programme - Prajnavahini Global School{% endblock %}
{% block content %}
<section class="after-school-section">

    <div class="container">

        <div class="col-lg-12 text-center mb-50">
            <div class="section-title wow fadeInDown animated">
                <h2 style="color: #ff7350;">Nurture – After School Programmes</h2>
            </div>
        </div>

        <!-- IMPORTANT ROW -->
        <div class="row">
            {% for program in programs %}
            <div class="col-lg-4 col-md-6 mb-4">
                <div class="infra-item p-4 h-100 text-center"
                     style="background:#021341; border-radius:10px; box-shadow:0 3px 10px rgba(0,0,0,0.05); color:#fff;">

                    <h4>{{ program.title }}</h4>
                    {% if program.image %}
                    <img src="{{ program.image.url }}" alt="{{ program.title }}"
                         style="width:100%; height:180px; object-fit:cover; border-radius:8px; margin:10px 0;">
                    {% endif %}
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
